<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avaimeton Karttatesti</title>
    
    <!-- Ladataan perus Leaflet-karttakirjasto -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #eeddcc; }
        #map { height: 100vh; width: 100%; }
        .info-box { position: absolute; top: 10px; left: 10px; background: white; padding: 10px; border-radius: 5px; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.3); font-family: sans-serif; font-size: 14px; font-weight: bold; color: #2e5a1c; }
    </style>
</head>
<body>

    <div class="info-box">Testi: OpenStreetMap (Avainta ei tarvita)</div>
    <div id="map"></div>

    <script>
        // Alustetaan kartta Rovaniemen kohdalle
        const map = L.map('map').setView([66.5031, 25.7270], 13);

        // Käytetään OpenStreetMap-karttapohjaa, joka on täysin julkinen ja vapaa
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);
    </script>
</body>
</html>
